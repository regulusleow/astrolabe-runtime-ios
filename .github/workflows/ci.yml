name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Validate release metadata
        run: npm test

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --parallel

      - name: Build release product
        run: swift build -c release --product AstrolabeRuntime

  ios-simulator:
    name: iOS Simulator and framework tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run iOS Simulator and framework tests
        run: scripts/run-ios-simulator-tests.sh

      - name: Verify Release automatic runtime framework
        run: |
          ASTROLABE_ARTIFACT_CONFIGURATION=Release \
            scripts/verify-auto-start-artifact.sh
